<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vybe Finanças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              vybe: {
                bg: '#121212',
                card: '#1E1E1E',
                accent: '#FF6600',
                text: '#FFFFFF',
                muted: '#B0B0B0',
                green: '#10B981',
                red: '#EF4444',
              },
            },
            animation: {
              'bar-grow': 'bar-grow 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              'bar-grow': {
                '0%': { transform: 'scaleY(0)' },
                '100%': { transform: 'scaleY(1)' },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #121212;
        color: #ffffff;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #121212;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF6600;
      }

      /* Print Styles */
      @media print {
        @page {
            margin: 1cm;
            size: auto;
        }

        body {
          background-color: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        /* Reset all animations and transforms to ensure visibility */
        *, *::before, *::after {
            animation: none !important;
            transition: none !important;
            transform: none !important;
            opacity: 1 !important;
            visibility: visible !important;
        }

        /* Explicitly fix the main animation container */
        .animate-bar-grow {
            transform: none !important;
            animation: none !important;
        }
        
        /* Hide scrollbars during print */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Hide elements that shouldn't be printed */
        header, footer, button, .no-print {
          display: none !important;
        }
        
        /* Expand containers to show full content */
        .overflow-auto, .overflow-y-auto, .overflow-x-auto {
            overflow: visible !important;
            height: auto !important;
            max-height: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
